<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0c111d; color: white; font-family: sans-serif; padding: 15px; margin: 0; }
        .top-pay { background: #1e293b; border: 1px solid #334155; padding: 15px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-topup { background: #22c55e; color: white; border: none; padding: 8px 14px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .plan-card { background: #1e1b4b; border: 1px solid #4338ca; padding: 18px; border-radius: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; font-weight: bold; }
    </style>
</head>
<body>
    <!-- Yuqorida hisob to'ldirish -->
    <div class="top-pay">
        <div>Balans: <b style="color:#22c55e">0 so'm</b></div>
        <button class="btn-topup" onclick="tg.sendData('topup'); tg.close();">Hisob to'ldirish +</button>
    </div>

    <h3 style="color:#94a3b8;">⭐️ Premium Obunalar</h3>
    <div class="plan-card"><span>1 Oy Premium</span><span style="color:#fbbf24">35.000 so'm</span></div>
    <div class="plan-card"><span>3 Oy Premium</span><span style="color:#fbbf24">95.000 so'm</span></div>
    <div class="plan-card"><span>1 Yil Premium</span><span style="color:#fbbf24">290.000 so'm</span></div>

    <script>const tg = window.Telegram.WebApp; tg.expand();</script>
</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gifts</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0c111d; color: white; font-family: sans-serif; padding: 15px; margin: 0; }
        
        /* Kartalarni juda katta va yirik qilish */
        .gifts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .gift-card { background: #1e293b; border: 2px solid #334155; padding: 35px 10px; border-radius: 25px; text-align: center; cursor: pointer; }
        .gift-card:active { border-color: #6366f1; transform: scale(0.96); }
        
        /* SOVG'ANING SHAKLI VA EMOJISI (JUDA KATTA) */
        .gift-shape { font-size: 80px; display: block; margin-bottom: 10px; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5)); }
        .gift-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .gift-price { color: #fbbf24; font-weight: bold; background: #0f172a; padding: 6px 12px; border-radius: 12px; display: inline-block; }
    </style>
</head>
<body>
    <h2 style="color:#94a3b8; margin-top: 5px;">🎁 Gift Sovg'alar</h2>
    
    <div class="gifts-grid">
        <div class="gift-card">
            <span class="gift-shape">🧸</span>
            <div class="gift-title">Ayiqcha</div>
            <div class="gift-price">5.000 so'm</div>
        </div>
        <div class="gift-card">
            <span class="gift-shape">🌹</span>
            <div class="gift-title">Atirgul</div>
            <div class="gift-price">7.000 so'm</div>
        </div>
        <div class="gift-card">
            <span class="gift-shape">🚀</span>
            <div class="gift-title">Roketa</div>
            <div class="gift-price">15.000 so'm</div>
        </div>
        <div class="gift-card">
            <span class="gift-shape">🏆</span>
            <div class="gift-title">Kubok</div>
            <div class="gift-price">28.000 so'm</div>
        </div>
    </div>

    <script>const tg = window.Telegram.WebApp; tg.expand();</script>
</body>
</html>

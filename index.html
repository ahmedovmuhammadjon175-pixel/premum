<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TezkorStarsXBot - WebApp</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: #0f111a;
      color: #ffffff;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Balance Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
    }

    .balance-info {
      font-size: 13px;
      color: #94a3b8;
    }

    .balance-amount {
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
    }

    .btn-add-balance {
      background-color: #10b981;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Card Box */
    .card {
      background-color: #171925;
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid #23263a;
    }

    .input-label {
      font-size: 14px;
      color: #94a3b8;
    }

    .input-group {
      display: flex;
      gap: 8px;
      background-color: #0f111a;
      border-radius: 12px;
      padding: 6px;
      border: 1px solid #2a2d43;
    }

    .input-group input {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 15px;
      padding: 8px 12px;
      outline: none;
    }

    .btn-self {
      background-color: #5856d6;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Tariffs Grid */
    .tariffs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .tariff-item {
      background-color: #0f111a;
      border: 1px solid #2a2d43;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tariff-item.active {
      border: 2px solid #5856d6;
      box-shadow: 0 0 12px rgba(88, 86, 214, 0.3);
    }

    .tariff-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .tariff-price {
      font-size: 12px;
      color: #eab308;
    }

    /* Main Action Button */
    .btn-primary {
      background-color: #5856d6;
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      width: 100%;
    }

    /* Tab Section */
    .tabs {
      display: flex;
      background-color: #0f111a;
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      font-size: 13px;
      color: #94a3b8;
      border-radius: 8px;
      cursor: pointer;
    }

    .tab.active {
      background-color: #272a3e;
      color: #ffffff;
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      padding: 24px 0;
    }
  </style>
</head>
<body>

<!-- Balans paneli -->
<div class="top-bar">
    <div>
        <div class="balance-info">BALANS:</div>
        <div class="balance-amount"><span id="userBalance">0</span> so'm</div>
    </div>
    <button class="btn-add-balance" onclick="openPaymentModal()">+ Hisobni to'ldirish</button>
</div>

<!-- 1-RASMDAGI KARTA BILAN TO'LOV BLOKI -->
<div class="card">
    <div style="font-weight: bold; margin-bottom: 10px; font-size: 16px;">💳 Karta orqali to'lov</div>
    <div class="input-label">To'lov miqdori (Min: 1000 so'm)</div>
    <div class="input-group" style="margin-top: 8px;">
        <input type="number" id="payAmountInput" placeholder="💰 Summa..." value="10000">
    </div>
    <button class="btn-primary" style="margin-top: 15px; background: #eab308; color: #000; font-weight: bold;" onclick="processPayment()">To'lovga o'tish 🚀</button>
</div>

<!-- 2-RASMDAGI MODAL OYNA (Yashirin turadi) -->
<div id="paymentModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
    <div class="card" style="width: 85%; max-width: 350px; background: #1e293b; text-align: center; border: 1px solid #334155;">
        <h3 style="margin-top: 0;">Hisobni to'ldirish</h3>
        
        <div style="background: #0f172a; padding: 12px; border-radius: 8px; margin: 15px 0;">
            <div style="font-size: 12px; color: #94a3b8;">O'tkaziladigan summa:</div>
            <div id="modalAmount" style="font-size: 22px; font-weight: bold; color: #eab308; margin: 5px 0;">10 000 so'm</div>
            <div style="font-size: 11px; color: #f43f5e; background: rgba(244,63,94,0.1); padding: 5px; border-radius: 4px;">⚠️ Iltimos, aynan ko'rsatilgan summani o'tkazing!</div>
        </div>

        <div style="background: #0f172a; padding: 12px; border-radius: 8px; text-align: left; margin-bottom: 15px;">
            <div style="font-size: 12px; color: #94a3b8;">Karta raqami:</div>
            <div style="font-size: 16px; font-weight: bold; color: #fff; letter-spacing: 1px;">5614 6821 1662 9579</div>
            <div style="font-size: 13px; color: #cbd5e1; margin-top: 4px;">Xakimjonov Muhammadshokir</div>
            <div style="font-size: 11px; color: #64748b;">Uzcard</div>
        </div>

        <button class="btn-primary" style="background: #6366f1; width: 100%; padding: 12px; font-weight: bold;" onclick="sendPaymentToBot()">✅ To'lov qildim</button>
        <button style="background: transparent; border: none; color: #94a3b8; margin-top: 10px; cursor: pointer;" onclick="closeModal()">Yopish</button>
    </div>
</div>
  

  <script>
    let tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    let selectedTariffName = '6 Oy';
    let selectedPrice = 220000;

    function setMyUsername() {
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
        document.getElementById('usernameInput').value = '@' + (tg.initDataUnsafe.user.username || '');
      } else {
        document.getElementById('usernameInput').value = '@my_username';
      }
    }

    function selectTariff(element, name, price) {
      document.querySelectorAll('.tariff-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      selectedTariffName = name;
      selectedPrice = price;
    }

  
function addBalance() {
    let amount = prompt("Karta orqali to'lov qilingan summani kiriting (so'mda):", "10000");
    
    if (!amount) return;

    if (tg) {
        tg.sendData(JSON.stringify({ 
            action: 'topup_request', 
            amount: amount 
        }));
    } else {
        alert("To'lov so'rovi yuborildi: " + amount + " so'm");
    }
}
    

    function submitOrder() {
      let username = document.getElementById('usernameInput').value;
      if (!username) {
        alert("Iltimos, Telegram username kiriting!");
        return;
      }

      let payload = {
        action: 'buy_premium',
        username: username,
        tariff: selectedTariffName,
        price: selectedPrice
      };

      if (tg) {
        tg.sendData(JSON.stringify(payload));
      } else {
        alert("Buyurtma yuborildi: " + JSON.stringify(payload));
      }
    }
  </script>
</body>
  </html>

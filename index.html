<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TezkorStarsXBot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0c111d; color: white; font-family: sans-serif; margin: 0; padding: 15px; }
        
        /* HEADER (Balance + Premium) */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .balance { font-size: 14px; color: #94a3b8; }
        .premium-btn { background: #22c55e; color: white; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 13px; }

        /* GRID (Sovg'alar) */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .card { background: #1e293b; border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; transition: 0.2s; }
        .card:active { transform: scale(0.95); }
        .icon { font-size: 35px; margin-bottom: 5px; }
        .stars-badge { background: #334155; display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; color: #fbbf24; }

        /* MODAL (Oyna) */
        .modal { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #1e293b; border-radius: 20px 20px 0 0; padding: 20px; box-sizing: border-box; z-index: 100; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); }
        .input-group { position: relative; margin: 15px 0; }
        .input-box { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #0f172a; color: white; box-sizing: border-box; }
        .self-btn { position: absolute; right: 5px; top: 5px; background: #6366f1; border: none; color: white; padding: 7px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .switch-row { display: flex; justify-content: space-between; margin: 15px 0; color: #94a3b8; }
        .price-text { text-align: center; color: #f87171; font-weight: bold; font-size: 18px; margin: 10px 0; }
        .actions { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<!-- Header: Balance va Premium -->
<div class="header">
    <div>
        <div style="font-size: 12px; color: #94a3b8;">BALANS:</div>
        <div style="font-size: 18px; font-weight: bold;">0 so'm</div>
    </div>
    <div class="premium-btn" onclick="openPremium()">+ Hisobni to'ldirish</div>
</div>

<!-- Sovg'alar Grid -->
<div class="grid" id="giftGrid"></div>

<!-- Modal Oyna -->
<div class="modal" id="modal">
    <div id="modalIcon" style="font-size: 70px; text-align: center;"></div>
    <h3 id="modalName" style="text-align: center; margin: 10px 0;"></h3>
    <div class="stars-badge" id="modalStars" style="margin: 0 auto; display: block; width: fit-content;"></div>
    
    <div class="input-group">
        <input type="text" id="username" class="input-box" placeholder="@username">
        <button class="self-btn" onclick="setSelf()">O'zimga</button>
    </div>

    <div class="switch-row">
        <span>Izoh qo'shish</span>
        <input type="checkbox">
    </div>

    <div class="price-text" id="totalPrice"></div>

    <div class="actions">
        <button class="btn" style="background:#334155; color:white;" onclick="closeModal()">Bekor qilish</button>
        <button class="btn" style="background:#6366f1; color:white;" onclick="sendGift()">Yuborish</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const gifts = [
        { name: 'PUSHTI YURAK', icon: '💝', stars: 15, price: 5000 },
        { name: 'AYIQCHA', icon: '🧸', stars: 15, price: 5000 },
        { name: 'SOVG\'A QUTISI', icon: '🎁', stars: 25, price: 7000 },
        { name: 'ATIRGUL', icon: '🌹', stars: 25, price: 7000 },
        { name: 'TO\'RT', icon: '🎂', stars: 50, price: 15000 },
        { name: 'GUL', icon: '💐', stars: 50, price: 15000 },
        { name: 'ROKETA', icon: '🚀', stars: 50, price: 15000 },
        { name: 'BUTULKA', icon: '🍾', stars: 50, price: 15000 },
        { name: 'KUBOK', icon: '🏆', stars: 100, price: 28000 },
        { name: 'UZUK', icon: '💍', stars: 100, price: 28000 }
    ];

    function render() {
        const grid = document.getElementById('giftGrid');
        gifts.forEach(g => {
            grid.innerHTML += `
                <div class="card" onclick="openModal('${g.name}')">
                    <div class="icon">${g.icon}</div>
                    <div class="stars-badge">⭐ ${g.stars}</div>
                </div>
            `;
        });
    }

    let currentGift = null;
    function openModal(name) {
        currentGift = gifts.find(g => g.name === name);
        document.getElementById('modalIcon').innerText = currentGift.icon;
        document.getElementById('modalName').innerText = currentGift.name;
        document.getElementById('modalStars').innerText = '⭐ ' + currentGift.stars;
        document.getElementById('totalPrice').innerText = 'Jami narx: ' + currentGift.price.toLocaleString() + ' so\'m';
        document.getElementById('modal').style.display = 'block';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function setSelf() { document.getElementById('username').value = '@' + (tg.initDataUnsafe?.user?.username || 'user'); }
    function openPremium() { alert("Premium (Hisobni to'ldirish) menyusi ochildi"); }
    
    function sendGift() {
        const data = { action: 'buy_gift', gift: currentGift.name, to: document.getElementById('username').value };
        tg.sendData(JSON.stringify(data));
        tg.close();
    }

    render();
</script>
</body>
</html>

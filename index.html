<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sovg'alar do'koni</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0f172a; color: #ffffff; padding: 15px; padding-bottom: 30px; }
        
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .gift-card { background-color: #1e293b; border-radius: 16px; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s; }
        .gift-card:active { transform: scale(0.95); }
        .gift-icon { font-size: 50px; margin-bottom: 8px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
        .gift-name { font-size: 11px; font-weight: bold; color: #94a3b8; text-align: center; margin-bottom: 6px; }
        
        .star-price { background-color: #334155; color: #fbbf24; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
        .star-price::before { content: '⭐'; font-size: 13px; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.7); display: none; z-index: 100; align-items: flex-end; justify-content: center; }
        .modal-content { background-color: #0f172a; width: 100%; max-width: 500px; border-radius: 24px 24px 0 0; padding: 20px; position: relative; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-btn { background: none; border: none; color: #94a3b8; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .menu-dots { color: #94a3b8; font-size: 20px; font-weight: bold; }

        .modal-body { display: flex; flex-direction: column; align-items: center; }
        .modal-icon { font-size: 70px; margin-bottom: 10px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4)); }
        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; color: #f8fafc; text-align: center; }
        
        .input-group { width: 100%; margin-top: 20px; }
        .input-label { font-size: 11px; color: #94a3b8; font-weight: bold; margin-bottom: 8px; display: block; text-transform: uppercase; }
        .input-wrapper { display: flex; background-color: #1e293b; border-radius: 12px; padding: 5px; align-items: center; }
        .username-input { flex: 1; background: none; border: none; color: white; padding: 12px 10px; font-size: 15px; outline: none; }
        .username-input::placeholder { color: #64748b; }
        .self-btn { background-color: #6366f1; color: white; border: none; padding: 8px 16px; border-radius: 10px; font-weight: bold; font-size: 13px; cursor: pointer; }

        .total-price { color: #ef4444; font-size: 15px; font-weight: bold; margin: 20px 0; text-align: center; }
        .action-buttons { display: flex; gap: 10px; width: 100%; }
        .btn { flex: 1; padding: 15px; border-radius: 14px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-cancel { background-color: #1e293b; color: white; }
        .btn-send { background-color: #6366f1; color: white; }
    </style>
</head>
<body>
    <div class="grid-container" id="giftsGrid"></div>

    <div class="modal-overlay" id="giftModal">
        <div class="modal-content">
            <div class="modal-header">
                <button class="close-btn" onclick="closeModal()">✕ Yopish</button>
                <div class="menu-dots">⋮</div>
            </div>
            
            <div class="modal-body">
                <div class="modal-icon" id="modalIcon">💝</div>
                <div class="modal-title" id="modalTitle">SOVG'A</div>
                <div class="star-price" id="modalStar">15</div>
                
                <div class="input-group">
                    <label class="input-label">Qabul qiluvchi (Telegram Username):</label>
                    <div class="input-wrapper">
                        <input type="text" id="usernameInput" class="username-input" placeholder="@ username">
                        <button class="self-btn" onclick="setSelfUsername()">O'zimga</button>
                    </div>
                </div>

                <div class="total-price" id="totalPriceText">Jami narx: 5 000 so'm</div>

                <div class="action-buttons">
                    <button class="btn btn-cancel" onclick="closeModal()">Bekor qilish</button>
                    <button class="btn btn-send" onclick="sendGift()">Yuborish</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const gifts = [
            { id: 'heart', icon: '💝', name: 'PUSHTI YURAK', stars: 15, price: 5000 },
            { id: 'teddy', icon: '🧸', name: 'AYIQCHA', stars: 15, price: 5000 },
            { id: 'box', icon: '🎁', name: 'SOVG\'A QUTISI', stars: 25, price: 7000 },
            { id: 'rose', icon: '🌹', name: 'ATIRGUL', stars: 25, price: 7000 },
            { id: 'cake', icon: '🎂', name: 'TO\'RT', stars: 50, price: 15000 },
            { id: 'bouquet', icon: '💐', name: 'GUL', stars: 50, price: 15000 },
            { id: 'rocket', icon: '🚀', name: 'ROKETA', stars: 50, price: 15000 },
            { id: 'champagne', icon: '🍾', name: 'BUTULKA', stars: 50, price: 15000 },
            { id: 'trophy', icon: '🏆', name: 'KUBOK', stars: 100, price: 28000 },
            { id: 'ring', icon: '💍', name: 'UZUK', stars: 100, price: 28000 }
        ];

        let selectedGift = null;

        function renderGifts() {
            const grid = document.getElementById('giftsGrid');
            gifts.forEach(gift => {
                const card = document.createElement('div');
                card.className = 'gift-card';
                card.onclick = () => openModal(gift);
                card.innerHTML = `
                    <div class="gift-icon">${gift.icon}</div>
                    <div class="gift-name">${gift.name}</div>
                    <div class="star-price">${gift.stars}</div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(gift) {
            selectedGift = gift;
            document.getElementById('modalIcon').innerText = gift.icon;
            document.getElementById('modalTitle').innerText = gift.name;
            document.getElementById('modalStar').innerText = gift.stars;
            
            const formattedPrice = gift.price.toLocaleString('ru-RU');
            document.getElementById('totalPriceText').innerText = `Jami narx: ${formattedPrice} so'm`;
            
            document.getElementById('usernameInput').value = '';
            document.getElementById('giftModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('giftModal').style.display = 'none';
        }

        function setSelfUsername() {
            const user = tg.initDataUnsafe?.user;
            if (user && user.username) {
                document.getElementById('usernameInput').value = '@' + user.username;
            } else {
                alert("Sizning Telegram profilingizda username yo'q!");
            }
        }

        function sendGift() {
            let username = document.getElementById('usernameInput').value.trim();
            if (!username) { tg.showAlert("Iltimos, qabul qiluvchi usernameni kiriting!"); return; }

            const data = { action: 'buy_gift', tariff: selectedGift.name, price: selectedGift.price, username: username };
            tg.sendData(JSON.stringify(data));
            tg.close();
        }

        renderGifts();
    </script>
</body>
</html>

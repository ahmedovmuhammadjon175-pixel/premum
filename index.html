<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do'kon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: white; padding: 15px; }
        h2 { margin: 15px 0 10px 0; font-size: 16px; color: #94a3b8; }
        .card { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .card:active { transform: scale(0.98); }
        .price { color: #fbbf24; font-weight: bold; }
    </style>
</head>
<body>

    <h2>⭐️ Premium Tariflar</h2>
    <div class="card" onclick="send('buy_premium', '3 Oy', 170000)">
        <span>3 Oy Premium</span>
        <span class="price">170 000 so'm</span>
    </div>
    <div class="card" onclick="send('buy_premium', '6 Oy', 225000)">
        <span>6 Oy Premium</span>
        <span class="price">225 000 so'm</span>
    </div>
    <div class="card" onclick="send('buy_premium', '12 Oy', 400000)">
        <span>12 Oy Premium</span>
        <span class="price">400 000 so'm</span>
    </div>

    <h2>🎁 Sovg'alar</h2>
    <div class="card" onclick="send('buy_gift', 'Yurak', 5000)">
        <span>💝 Pushti Yurak</span>
        <span class="price">5 000 so'm</span>
    </div>
    <div class="card" onclick="send('buy_gift', 'Ayiqcha', 5000)">
        <span>🧸 Ayiqcha</span>
        <span class="price">5 000 so'm</span>
    </div>
    <div class="card" onclick="send('buy_gift', 'Uzuk', 28000)">
        <span>💍 Uzuk</span>
        <span class="price">28 000 so'm</span>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function send(action, tariff, price) {
            const username = tg.initDataUnsafe?.user?.username || '';
            const data = {
                action: action,
                tariff: tariff,
                price: price,
                username: username
            };
            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>

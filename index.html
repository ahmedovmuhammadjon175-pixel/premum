<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Olish</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { background-color: #0f111a; color: #ffffff; font-family: sans-serif; margin: 0; padding: 16px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background-color: #1e293b; padding: 12px 16px; border-radius: 12px; }
    .balance-info { font-size: 12px; color: #94a3b8; }
    .balance-amount { font-size: 18px; font-weight: bold; }
    .btn-add-balance { background: #5856d6; color: #ffffff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .card { background-color: #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    .input-label { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
    .input-group { display: flex; align-items: center; background-color: #0f111a; border: 1px solid #2a2d43; border-radius: 10px; padding: 12px; position: relative; }
    .input-group input { background: transparent; border: none; color: #ffffff; font-size: 15px; width: 100%; outline: none; }
    .auto-fill { position: absolute; right: 12px; color: #5856d6; font-size: 12px; font-weight: bold; cursor: pointer; }
    .tariffs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .tariff-item { background-color: #0f111a; border: 1px solid #2a2d43; border-radius: 14px; padding: 14px; text-align: center; cursor: pointer; }
    .tariff-item.active { border: 2px solid #5856d6; }
    .tariff-title { font-size: 16px; font-weight: bold; margin-bottom: 4px; }
    .tariff-price { font-size: 12px; color: #eab308; }
    .btn-primary { background-color: #5856d6; color: #ffffff; border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; text-align: center; width: 100%; margin-top: 15px; }
  </style>
</head>
<body>

<div class="top-bar">
    <div>
        <div class="balance-info">BALANS:</div>
        <div class="balance-amount"><span id="userBalance">0</span> so'm</div>
    </div>
    <button class="btn-add-balance" onclick="requestTopUp()">+ Hisobni to'ldirish</button>
</div>

<div class="card">
    <div style="font-weight: bold; margin-bottom: 15px; font-size: 16px;">⭐️ Premium sotib olish</div>
    
    <div class="input-label">Telegram username</div>
    <div class="input-group" style="margin-bottom: 15px;">
        <input type="text" id="usernameInput" placeholder="@username">
        <span class="auto-fill" onclick="setMyUsername()">Mening profilim</span>
    </div>

    <div class="input-label">Tarifni tanlang</div>
    <div class="tariffs">
        <div class="tariff-item active" onclick="selectTariff(this, '1 Oy', 45000)">
            <div class="tariff-title">1 Oy</div>
            <div class="tariff-price">45,000 so'm</div>
        </div>
        <div class="tariff-item" onclick="selectTariff(this, '3 Oy', 170000)">
            <div class="tariff-title">3 Oy</div>
            <div class="tariff-price">170,000 so'm</div>
        </div>
        <div class="tariff-item" onclick="selectTariff(this, '6 Oy', 220000)">
            <div class="tariff-title">6 Oy</div>
            <div class="tariff-price">220,000 so'm</div>
        </div>
        <div class="tariff-item" onclick="selectTariff(this, '12 Oy', 400000)">
            <div class="tariff-title">12 Oy</div>
            <div class="tariff-price">400,000 so'm</div>
        </div>
    </div>

    <button class="btn-primary" onclick="submitOrder()">Premium xarid qilish</button>
</div>

<script>
let tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) tg.expand();

let selectedTariffName = '1 Oy';
let selectedPrice = 45000;

function setMyUsername() {
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
        document.getElementById('usernameInput').value = '@' + (tg.initDataUnsafe.user.username || 'my_username');
    } else {
        document.getElementById('usernameInput').value = '@my_username';
    }
}

function selectTariff(element, name, price) {
    document.querySelectorAll('.tariff-item').forEach(el => el.classList.remove('active'));
    element.classList.add('active');
    selectedTariffName = name;
    selectedPrice = price;
}

function requestTopUp() {
    if (tg) {
        tg.sendData(JSON.stringify({ action: 'topup_request' }));
        tg.close();
    } else {
        alert("Hisobni to'ldirish so'rovi yuborildi!");
    }
}

function submitOrder() {
    let username = document.getElementById('usernameInput').value;
    if (!username) {
        alert("Iltimos, Telegram username kiriting!");
        return;
    }
    if (tg) {
        tg.sendData(JSON.stringify({
            action: 'buy_premium',
            username: username,
            tariff: selectedTariffName,
            price: selectedPrice
        }));
        tg.close();
    } else {
        alert("Buyurtma yuborildi: " + selectedTariffName);
    }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        h2 { border-left: 4px solid #6366f1; padding-left: 10px; margin-top: 30px; }
        
        /* 1. PREMIUM BO'LIMI */
        .premium-box { background: #1e293b; padding: 20px; border-radius: 20px; }
        .balans-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-mini { background: #6366f1; padding: 10px 15px; border-radius: 10px; font-size: 12px; cursor: pointer; }
        .plan-card { background: #0f172a; padding: 20px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

        /* 2. SOVG'A BO'LIMI (Katta kartalar) */
        .gift-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .gift-card { background: #1e293b; padding: 40px 20px; border-radius: 30px; text-align: center; border: 3px solid #334155; }
        .gift-icon { font-size: 80px; display: block; margin-bottom: 15px; }
        .gift-name { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .gift-price { color: #fbbf24; font-weight: bold; font-size: 16px; }

        /* 3. TO'LDIRISH BO'LIMI */
        .pay-box { background: #1e293b; padding: 25px; border-radius: 20px; text-align: center; }
        .input-pay { width: 100%; padding: 20px; border-radius: 15px; border: none; background: #0f172a; color: white; font-size: 18px; margin-top: 10px; box-sizing: border-box; }
        .btn-big { width: 100%; padding: 20px; border-radius: 15px; background: #6366f1; color: white; border: none; font-weight: bold; font-size: 16px; margin-top: 15px; }
    </style>
</head>
<body>

    <!-- 1. PREMIUM VA BALANS -->
    <h2>⭐️ Premium olish</h2>
    <div class="premium-box">
        <div class="balans-header">
            <div>Balans: <b>0 so'm</b></div>
            <div class="btn-mini" onclick="scrollToPay()">Hisobni to'ldirish +</div>
        </div>
        <div class="plan-card"><div>1 Oy Premium</div> <b>35.000 so'm</b></div>
        <div class="plan-card"><div>3 Oy Premium</div> <b>95.000 so'm</b></div>
    </div>

    <!-- 2. SOVG'A (KATTA KARTALAR) -->
    <h2>🎁 Sovg'alar</h2>
    <div class="gift-container">
        <div class="gift-card">
            <span class="gift-icon">🧸</span>
            <div class="gift-name">Ayiqcha</div>
            <div class="gift-price">5.000 so'm</div>
        </div>
        <div class="gift-card">
            <span class="gift-icon">🌹</span>
            <div class="gift-name">Atirgul</div>
            <div class="gift-price">7.000 so'm</div>
        </div>
        <div class="gift-card">
            <span class="gift-icon">🚀</span>
            <div class="gift-name">Roketa</div>
            <div class="gift-price">15.000 so'm</div>
        </div>
        <div class="gift-card">
            <span class="gift-icon">🏆</span>
            <div class="gift-name">Kubok</div>
            <div class="gift-price">28.000 so'm</div>
        </div>
    </div>

    <!-- 3. HISOBNI TO'LDIRISH -->
    <h2 id="pay-section">💳 Hisobni to'ldirish</h2>
    <div class="pay-box">
        <p>Karta: <b>5614 6821 1662 9579</b></p>
        <input type="number" class="input-pay" placeholder="Summani kiriting...">
        <button class="btn-big">To'lovni tasdiqlash</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function scrollToPay() {
            document.getElementById('pay-section').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>

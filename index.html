<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TezkorStarsXBot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; padding: 10px; margin: 0; }
        .premium-btn { background: #22c55e; color: white; padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; margin-bottom: 20px; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .card { background: #1e293b; border-radius: 12px; padding: 15px 5px; text-align: center; cursor: pointer; }
        .icon { font-size: 30px; margin-bottom: 5px; }
        .stars { font-size: 12px; color: #fbbf24; background: #334155; padding: 2px 8px; border-radius: 10px; }
        
        /* Modal oyna */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: flex-end; }
        .modal-content { background: #1e293b; width: 100%; max-width: 400px; padding: 20px; border-radius: 20px 20px 0 0; }
        .input-box { width: 100%; padding: 12px; border-radius: 10px; border: none; margin: 10px 0; background: #0f172a; color: white; box-sizing: border-box; }
        .btn-full { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<!-- Premium Tugmasi (Allohida turibdi) -->
<div class="premium-btn" onclick="openPremium()">⭐️ Hisobni to'ldirish (Premium)</div>

<!-- Sovg'alar Grid -->
<div class="grid" id="giftGrid"></div>

<!-- Sovg'a Modal oynasi -->
<div class="modal" id="modal">
    <div class="modal-content">
        <div id="modalIcon" style="font-size: 60px; text-align: center;"></div>
        <h3 id="modalName" style="text-align: center;"></h3>
        <input type="text" id="username" class="input-box" placeholder="@username">
        <button class="btn-full" style="background:#6366f1" onclick="setSelf()">O'zimga</button>
        <div id="totalPrice" style="text-align: center; margin: 15px; color: #ef4444; font-weight: bold;"></div>
        <button class="btn-full" style="background:#334155" onclick="closeModal()">Bekor qilish</button>
        <button class="btn-full" style="background:#6366f1" onclick="send()">Yuborish</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const gifts = [
        { name: 'Pushti yurak', icon: '💝', price: 5000 },
        { name: 'Ayiqcha', icon: '🧸', price: 5000 },
        { name: 'Sovg\'a qutisi', icon: '🎁', price: 7000 },
        { name: 'Atirgul', icon: '🌹', price: 7000 },
        { name: 'To\'rt', icon: '🎂', price: 15000 },
        { name: 'Gul', icon: '💐', price: 15000 },
        { name: 'Roketa', icon: '🚀', price: 15000 },
        { name: 'Butulka', icon: '🍾', price: 15000 },
        { name: 'Kubok', icon: '🏆', price: 28000 },
        { name: 'Uzuk', icon: '💍', price: 28000 }
    ];

    function render() {
        const grid = document.getElementById('giftGrid');
        gifts.forEach(g => {
            grid.innerHTML += `
                <div class="card" onclick="openModal('${g.name}')">
                    <div class="icon">${g.icon}</div>
                    <div class="stars">${g.price.toLocaleString()} so'm</div>
                </div>
            `;
        });
    }

    let currentGift = null;
    function openModal(name) {
        currentGift = gifts.find(g => g.name === name);
        document.getElementById('modalIcon').innerText = currentGift.icon;
        document.getElementById('modalName').innerText = currentGift.name;
        document.getElementById('totalPrice').innerText = 'Jami narx: ' + currentGift.price.toLocaleString() + ' so\'m';
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function setSelf() { document.getElementById('username').value = '@' + (tg.initDataUnsafe?.user?.username || 'user'); }
    function openPremium() { alert("Premium menyusiga o'tish..."); } // Bu yerda Premium uchun funksiya yozasiz
    
    function send() {
        const data = { action: 'buy_gift', gift: currentGift.name, to: document.getElementById('username').value };
        tg.sendData(JSON.stringify(data));
        tg.close();
    }

    render();
</script>
</body>
</html>

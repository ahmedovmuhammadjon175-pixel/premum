<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovg'alar Do'koni</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; padding: 10px; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .card { background: #1e293b; border-radius: 12px; padding: 15px 5px; text-align: center; cursor: pointer; transition: 0.2s; }
        .card:active { transform: scale(0.95); }
        .icon { font-size: 40px; margin-bottom: 5px; }
        .stars { background: #334155; display: inline-block; padding: 2px 10px; border-radius: 15px; font-size: 12px; color: #fbbf24; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: flex-end; }
        .modal-content { background: #1e293b; width: 100%; max-width: 400px; padding: 20px; border-radius: 20px 20px 0 0; }
        .input-box { width: 100%; padding: 12px; border-radius: 10px; border: none; margin: 10px 0; background: #0f172a; color: white; }
        .btn-blue { background: #6366f1; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; }
        .btn-full { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="grid" id="giftGrid"></div>

<div class="modal" id="modal">
    <div class="modal-content">
        <div id="modalIcon" style="font-size: 60px; text-align: center;"></div>
        <h3 id="modalName" style="text-align: center; margin: 10px 0;"></h3>
        <div class="stars" id="modalStars" style="display: block; width: fit-content; margin: 0 auto;"></div>
        
        <input type="text" id="username" class="input-box" placeholder="@username">
        <button class="btn-blue" onclick="setSelf()">O'zimga</button>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin: 15px 0;">
            <span>Izoh qo'shish</span>
            <input type="checkbox" id="addComment">
        </div>
        
        <div id="totalPrice" style="text-align: center; color: #ef4444; font-weight: bold; margin-bottom: 10px;"></div>
        
        <button class="btn-full" style="background: #334155; color: white;" onclick="closeModal()">Bekor qilish</button>
        <button class="btn-full" style="background: #6366f1; color: white;" onclick="send()">Yuborish</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const gifts = [
        { name: 'PUSHTI YURAK', icon: '💝', stars: 15, price: 5000 },
        { name: 'AYIQCHA', icon: '🧸', stars: 15, price: 5000 },
        { name: 'SOVG\'A QUTISI', icon: '🎁', stars: 25, price: 7000 },
        { name: 'ATIRGUL', icon: '🌹', stars: 25, price: 7000 },
        { name: 'TO\'RT', icon: '🎂', stars: 50, price: 15000 },
        { name: 'GUL', icon: '💐', stars: 50, price: 15000 },
        { name: 'ROKETA', icon: '🚀', stars: 50, price: 15000 },
        { name: 'BUTULKA', icon: '🍾', stars: 50, price: 15000 },
        { name: 'KUBOK', icon: '🏆', stars: 100, price: 28000 },
        { name: 'UZUK', icon: '💍', stars: 100, price: 28000 }
    ];

    let currentGift = null;

    function render() {
        const grid = document.getElementById('giftGrid');
        gifts.forEach(g => {
            grid.innerHTML += `
                <div class="card" onclick="openModal('${g.name}')">
                    <div class="icon">${g.icon}</div>
                    <div class="stars">⭐ ${g.stars}</div>
                </div>
            `;
        });
    }

    function openModal(name) {
        currentGift = gifts.find(g => g.name === name);
        document.getElementById('modalIcon').innerText = currentGift.icon;
        document.getElementById('modalName').innerText = currentGift.name;
        document.getElementById('modalStars').innerText = '⭐ ' + currentGift.stars;
        document.getElementById('totalPrice').innerText = 'Jami narx: ' + currentGift.price.toLocaleString() + ' so\'m';
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    function setSelf() { document.getElementById('username').value = '@' + (tg.initDataUnsafe?.user?.username || 'user'); }

    function send() {
        const data = { action: 'buy_gift', gift: currentGift.name, price: currentGift.price, to: document.getElementById('username').value };
        tg.sendData(JSON.stringify(data));
        tg.close();
    }

    render();
</script>
</body>
</html>
